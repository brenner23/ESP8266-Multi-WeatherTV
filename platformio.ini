; ============================================================
;  PlatformIO - MeinWetter Vorlage (autark)
;  ESP8266 : Weather TV (Yellow) / schwarzer TV (Black) / Cube
;  Display: ST7789V 240x240 SPI, OpenWeather direkt
; ============================================================
;  SPIEGEL wird PER ENVIRONMENT gesetzt (nicht in pins.h):
;    Yellow / Black -> -D USE_MIRROR=0  (normal, nicht gespiegelt)
;    Cube_*         -> -D USE_MIRROR=1  (Prisma-Wuerfel, gespiegelt)
;  FORECAST: in pins.h -> HAS_FORECAST 0 (kein Touch am 8266)
; ------------------------------------------------------------
;  ORDNER neben platformio.ini legen (wie im C2-Projekt):
;    Icons/  -> weather_icons.h, tux1_icon.h + alle *_icon.h
;    fonts/  -> OCRA10pt7b.h, AGENCYB50pt7b.h
;    Die -I Zeilen unten machen sie fuer den Compiler auffindbar.
; ============================================================

[platformio]
default_envs = Geekmagic_Yellow_4m

; ── GEMEINSAME BASIS (gilt fuer alle Envs) ──────────────────
[env]
platform      = espressif8266
board         = esp12e            ; ESP-12F, 4MB (Default; Black ueberschreibt)
framework     = arduino

upload_speed  = 115200
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
    adafruit/Adafruit GFX Library @ ^1.11.10
    bblanchon/ArduinoJson @ ^7.0.0

; WICHTIG: keine ;-Kommentare INNERHALB der build_flags -> frisst die Folgezeile!
build_flags =
    -DARDUINO_ARCH_ESP8266
    -I Icons
    -I fonts

; ====================================================================

[env:Geekmagic_Yellow_4m]
board_build.flash_mode = dout
upload_protocol        = esptool
build_flags =
    ${env.build_flags}
    -D USE_MIRROR=0

[env:Geekmagic_Yellow_ota]
extends         = env:Geekmagic_Yellow_4m
upload_protocol = espota
upload_port     = 192.168.0.33
upload_flags    =
    --auth=GitHub345809regdfjhokfgdsfgdgf

; ====================================================================

[env:Geekmagic_Clone_4m]
board                  = esp01_1m
board_build.flash_mode = dout
board_build.ldscript   = eagle.flash.1m64.ld   ; 1MB Flash, 64KB SPIFFS -> mehr Platz fuer Sketch
upload_protocol        = esptool
build_flags =
    ${env.build_flags}
    -D USE_MIRROR=0

[env:Geekmagic_Clone_ota]
extends         = env:Geekmagic_Clone_4m
upload_protocol = espota
upload_port     = 192.168.0.34
upload_flags    =
    --auth=GitHub345809regdfjhokfgdsfgdgf

; ====================================================================

[env:Geekmagic_Cube_USB]
board_build.flash_mode = dout
upload_protocol        = esptool
build_flags =
    ${env.build_flags}
    -D USE_MIRROR=1

[env:Geekmagic_Cube_OTA]
extends         = env:Geekmagic_Cube_USB
upload_protocol = espota
upload_port     = 192.168.0.32
upload_flags    =
    --auth=GitHub345809regdfjhokfgdsfgdgf
    